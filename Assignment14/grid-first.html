<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Grid</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .grid div {
      background-color: #bde0fe;
      padding: 24px;
      text-align: center;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
</body>
</html>
